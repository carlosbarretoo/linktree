<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Links | Nome do Perfil</title>

    <!-- Importação de ícones do FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

  </head>
  <body>
    <div class="container">
      <!-- Foto de Perfil + Informações -->
      <div class="profile">
        <!-- coloque a foto -->
        <img
          src="img/imagemcarlos.jpg"
          alt="Foto de Perfil"
          class="profile-img"
        />
        <h1>Carlos Barreto</h1>
        <p>Editor de video | Desenvolvedor Web</p>
      </div>

      <!-- Lista de Links Principais -->
      <div class="links">
        <a href="https://seu-site.com" target="_blank" class="link-card">
          <i class="fas fa-globe"></i>
          <span>Meu Portfólio</span>
        </a>

        <a
          href="https://youtube.com/@carlinhosxtv"
          target="_blank"
          class="link-card"
        >
          <i class="fab fa-youtube"></i>
          <span>YouTube</span>
        </a>

        <a
          href="https://wa.me/+5595981152358"
          target="_blank"
          class="link-card"
        >
          <i class="fab fa-whatsapp"></i>
          <span>WhatsApp</span>
        </a>

        <a
          href="https://discord.gg/carlosbarretoo"
          target="_blank"
          class="link-card"
        >
          <i class="fab fa-discord"></i>
          <span>Discord</span>
        </a>
      </div>

      <!-- Redes Sociais Secundárias (Rodapézinho) -->
      <div class="social-icons">
        <a
          href="https://instagram.com/carlosbarrwto"
          target="_blank"
          aria-label="Instagram"
          ><i class="fab fa-instagram"></i
        ></a>
        <a
          href="https://github.com/carlosbarretoo"
          target="_blank"
          aria-label="GitHub"
          ><i class="fab fa-github"></i
        ></a>
        <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"
          ><i class="fab fa-linkedin-in"></i
        ></a>
        <a href="https://tiktok.com/" target="_blank" aria-label="TikTok"
          ><i class="fab fa-tiktok"></i
        ></a>
      </div>

      <footer>
        <p>Linktree</p>
      </footer>
    </div>
  </body>
</html>
